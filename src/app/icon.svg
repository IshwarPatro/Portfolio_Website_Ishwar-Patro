<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1828" />
      <stop offset="100%" stop-color="#0f0d14" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF937E" />
      <stop offset="100%" stop-color="#F2765E" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5EBDD" />
    </linearGradient>
  </defs>

  <!-- Dark celestial badge with rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#315B8C" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Subtle orbital ring -->
  <ellipse cx="32" cy="34" rx="28" ry="12" fill="none" stroke="#F2765E" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.35" transform="rotate(-15 32 34)" />

  <!-- IP Monogram -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28">
    <text x="13" y="43" fill="url(#coralGrad)">I</text>
    <text x="27" y="43" fill="url(#creamGrad)">P</text>
  </g>

  <!-- Glowing celestial planet / star -->
  <circle cx="50" cy="18" r="3.5" fill="#F2765E" />
  <circle cx="49" cy="17" r="1.5" fill="#FFFFFF" />
</svg>
